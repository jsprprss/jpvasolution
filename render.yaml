services:
  - type: web
    name: jpvasolution
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_build/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
